controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    jaco_arm_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController
jaco_arm_position_controller:
  ros__parameters:
    joints: [j2n6s200_joint_1, j2n6s200_joint_2, j2n6s200_joint_3, j2n6s200_joint_4, j2n6s200_joint_5, j2n6s200_joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.03
      j2n6s200_joint_1: {trajectory: 0.10, goal: 0.03}
      j2n6s200_joint_2: {trajectory: 0.10, goal: 0.03}
      j2n6s200_joint_3: {trajectory: 0.10, goal: 0.03}
      j2n6s200_joint_4: {trajectory: 0.10, goal: 0.03}
      j2n6s200_joint_5: {trajectory: 0.10, goal: 0.03}
      j2n6s200_joint_6: {trajectory: 0.10, goal: 0.03}
hand_controller:
  ros__parameters:
    joints: [j2n6s200_joint_finger_1, j2n6s200_joint_finger_2]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.03
      j2n6s200_joint_finger_1: {trajectory: 0.15, goal: 0.04}
      j2n6s200_joint_finger_2: {trajectory: 0.15, goal: 0.04}
